<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>North Star Bakery | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <img src="bakery-logo_c.png" alt="North Star Bakery logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>Contact North Star Bakery</h1>

        <section>
            <h2>Visit Us</h2>

            <p>123 Main Street, Your Town</p>

            <h3>Hours of Operation</h3>

            <p>Monday through Friday: 6:00 AM - 6:00 PM</p>
            <p>Saturday: 7:00 AM - 4:00 PM</p>
            <p>Sunday: Closed</p>
        </section>

        <section>
            <h2>Pre-Order or General Inquiry</h2>

            <form id="contact-form" novalidate>

                <fieldset>

                    <legend>Request Information</legend>

                    <p>
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name">
                        <span id="name-error"></span>
                    </p>

                    <p>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email">
                        <span id="email-error"></span>
                    </p>

                    <p>
                        <label for="pickup-date">Pickup Date:</label>
                        <input type="date" id="pickup-date" name="pickup-date">
                    </p>

                    <p>
                        <label for="request-type">Request Type:</label>

                        <select id="request-type" name="request-type" required>
                            <option value="">Choose a request type</option>
                            <option value="pre-order">Pre-Order</option>
                            <option value="question">General Question</option>
                        </select>
                    </p>

                    <p>
                        <label for="item-details">Item Details:</label>
                        <textarea id="item-details"
                                  name="item-details"
                                  rows="5"
                                  cols="30"
                                  required></textarea>
                    </p>

                    <p>
                        <label for="allergy-notes">Allergy Notes:</label>
                        <textarea id="allergy-notes"
                                  name="allergy-notes"
                                  rows="4"
                                  cols="30"></textarea>
                    </p>

                    <p>
                        <button type="submit">Submit Request</button>
                    </p>

                </fieldset>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 North Star Bakery</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
